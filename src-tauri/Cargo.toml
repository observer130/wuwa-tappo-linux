[package]
name = "wuwatappo-linux"
version = "1.0.5-1"
edition = "2021"
rust-version = "1.85"
description = "Linux community port of the Wuwa Tappo CN desktop pet"
authors = ["observer130"]
license = "MIT"
repository = "https://github.com/observer130/wuwa-tappo-linux"

[lib]
name = "wuwatappo_linux"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite builds rustls with default features off and does not
# select a crypto provider by itself. Pick ring explicitly; lib.rs installs
# it as the process default before the native WebSocket proxy runs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
libc = "0.2"
gtk = "0.18"
gdkx11 = "0.18"
x11rb = { version = "0.13", default-features = false, features = ["shape", "xfixes"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.release.build-override]
strip = "none"
